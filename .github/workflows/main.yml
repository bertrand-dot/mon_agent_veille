name: UA Radar National

on:
  schedule:
    # 03:00 UTC = 04:00 à Copenhague. 
    # Indispensable pour finir le scan avant 08:00.
    - cron: '0 3 * * 1-5'
  workflow_dispatch: 

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai pymupdf

      - name: 🎯 Exécution du Radar UA
        run: python scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: 💾 Sauvegarde de l'historique et des archives
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto] Mise à jour archive et historique"
          file_pattern: 'download_history.json leads_archive.json'
          branch: main
