name: Radar Urban Agency

on:
  workflow_dispatch:  # Permet de lancer le scan manuellement
  schedule:
    - cron: '0 8 * * *'  # Lancement automatique tous les jours à 8h00 UTC

# Autorise le robot à sauvegarder le fichier download_history.json
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Installer Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai

    - name: Lancer le Script Radar (SerpApi)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      run: python scraper.py

    - name: Sauvegarder l'historique (Anti-Erreur 128)
      run: |
        git config --global user.name "Urban Agency Bot"
        git config --global user.email "bot@urban-agency.com"
        git add download_history.json
        
        # On vérifie s'il y a des nouveaux scans à enregistrer
        if git diff --staged --quiet; then
          echo "Rien de nouveau à sauvegarder."
        else
          git commit -m "MAJ Historique de veille [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
        fi
