name: Radar Urban Agency

on:
  workflow_dispatch:  # Permet de lancer manuellement
  schedule:
    - cron: '0 8 * * *'  # Lance tous les jours à 8h00 UTC

# C'EST ICI QUE SE JOUE L'ERREUR 128 :
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai pymupdf

    - name: Lancer le Script Intelligence
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GOOGLE_SEARCH_KEY: ${{ secrets.GOOGLE_SEARCH_KEY }}
        GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      run: python scraper.py

    - name: Sauvegarder l'historique (Git Push)
      run: |
        git config --global user.name "Urban Agency Bot"
        git config --global user.email "bot@urban-agency.com"
        git add download_history.json
        # On vérifie s'il y a des changements avant de commit pour éviter une erreur
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour historique [skip ci]" && git push)
