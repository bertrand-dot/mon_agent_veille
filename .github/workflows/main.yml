name: Radar Urban Agency

on:
  workflow_dispatch:  # Permet de lancer manuellement
  schedule:
    - cron: '0 8 * * *'  # Lance tous les jours à 8h00 UTC

# Permet au robot d'écrire sur le dépôt
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important: récupère tout l'historique
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai pymupdf

    - name: Lancer le Script Intelligence
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GOOGLE_SEARCH_KEY: ${{ secrets.GOOGLE_SEARCH_KEY }}
        GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      run: python scraper.py

    - name: Sauvegarder l'historique
      run: |
        git config --global user.name "Urban Agency Bot"
        git config --global user.email "bot@urban-agency.com"
        git add download_history.json
        # On vérifie s'il y a des changements
        if git diff --staged --quiet; then
          echo "Rien à sauvegarder."
        else
          git commit -m "Mise à jour historique [skip ci]"
          git push
        fi
