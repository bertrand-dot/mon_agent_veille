name: UA Radar National

on:
  schedule:
    # Exécution à 08:00 UTC (09:00 ou 10:00 heure de Paris) du lundi au vendredi
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optimise la vitesse des lancements suivants

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai pymupdf

      - name: 🎯 Exécution du Radar UA
        run: python scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: 💾 Sauvegarde de l'historique et des archives
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto] Mise à jour de l'historique et des archives"
          file_pattern: 'download_history.json leads_archive.json'
          branch: main
