name: Radar Urban Agency

on:
  schedule:
    # Exécution automatique tous les jours à 8h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Exécuter le script de veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      - name: Sauvegarder l'historique (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          # On ajoute le fichier d'historique s'il a été modifié
          git add download_history.json
          # On ne commit que s'il y a des changements pour éviter les erreurs
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour de l'historique de veille" && git push)
