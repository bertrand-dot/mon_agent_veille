name: UA Radar National

on:

  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai pymupdf

      - name: 🎯 Exécution du Radar UA
        run: python scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: 💾 Sauvegarde sectorisée (Archives et Historique)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto] Mise à jour historique et archives sectorielles"
          # Pattern mis à jour pour capturer tous les fichiers JSON par région
          file_pattern: 'download_history.json leads_archive_*.json'
          branch: main
